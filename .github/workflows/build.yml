name: Build

on:
  push:
    branches: [claude/jolly-thompson-6bl4l4]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Download Rust package
        run: bash scripts/public/download_rust_package.sh

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Authenticator.xcodeproj -scheme Authenticator

      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Authenticator.xcodeproj \
            -scheme Authenticator \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log > /dev/null || true
          echo "=== errors ==="
          grep -nE "error:|^ld:|Undefined symbols|duplicate symbol|\*\* BUILD" build.log | grep -v "export " | sort -u -k2 | head -60
          echo "=== linker context ==="
          grep -n -B2 -A12 -E "^ld:|Undefined symbols|duplicate symbol" build.log | grep -v "export " | head -80
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
